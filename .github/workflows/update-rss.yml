name: Update PC Game RSS

on:
  schedule:
    - cron: "15,45 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          echo "Tests: OK"

      - name: Generate and validate live feeds
        run: >-
          python make_rss.py
          --output-dir site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --deployment-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --limit 40

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Verify public feeds
        run: >-
          python verify_public.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --minimum 40
          --deployment-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --attempts 12
          --retry-delay 10
